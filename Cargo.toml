[package]
name = "seam"
version = "0.1.0"
edition = "2024"
description = "Tracks a security review of a codebase and checks every claim against the source."
license = "MIT"
repository = "https://github.com/0xWerz/seam"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.27.1"
tree-sitter-typescript = "0.23.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
